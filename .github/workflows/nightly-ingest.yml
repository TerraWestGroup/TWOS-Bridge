name: Nightly TWOS Bridge Ingestion

on:
  schedule:
    # 11:30 UTC = 19:30 AWST (Australia/Perth is UTC+8 year-round, no DST).
    # MechanicDesk reports arrive ~18:10 AWST, so this leaves over an hour
    # of buffer for reports to land before the ingestion run.
    - cron: "30 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install xlrd pdfplumber

      - name: Run nightly ingestion
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          MAILBOX_ADDRESS: ${{ secrets.MAILBOX_ADDRESS }}
          XERO_CLIENT_ID: ${{ secrets.XERO_CLIENT_ID }}
          XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
        run: python scripts/nightly_ingest.py

      - name: Commit and push updated state
        run: |
          git config user.name "TWOS Bridge Ingestion Bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- data/twos-state.json; then
            echo "No changes to twos-state.json; nothing to commit."
            echo "STATE_CHANGED=false" >> "$GITHUB_ENV"
          else
            git add data/twos-state.json
            git commit -m "Automated nightly ingestion: update twos-state.json"
            git push
            echo "STATE_CHANGED=true" >> "$GITHUB_ENV"
          fi

      # IMPORTANT: a workflow's own automated commits/pushes (using the
      # default GITHUB_TOKEN, as above) do NOT trigger other workflows'
      # `on: push` -- this is a deliberate GitHub anti-recursion
      # safeguard. That means the separate "Deploy TWOS Bridge to Azure
      # Static Web Apps" workflow would never fire after a nightly
      # ingestion run. So deployment is done directly here instead,
      # right after the commit, rather than relying on that push to
      # trigger it.
      - name: Deploy to Azure Static Web Apps
        if: env.STATE_CHANGED == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: ""
          skip_app_build: true
